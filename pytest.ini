[pytest]
markers =
    regression: 전체 파이프라인 종단 Ground Truth 회귀 테스트 (tests/test_regression.py)
    requirement: Requirement Parsing 전용 테스트 (tests/test_requirements.py)
    candidate: Candidate Fact Extraction 전용 테스트 (tests/test_candidate_extraction.py)
    validation: Hard Requirement Validation 전용 테스트 (tests/test_hard_requirements.py)
    e2e: 실제 브라우저(Playwright)로 사용자 흐름을 검증하는 E2E/UX 테스트 (tests/e2e/) — 자세한 설명은 TESTING.md 참고
